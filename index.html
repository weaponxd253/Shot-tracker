<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shot Tracker</title>
    <meta
      name="description"
      content="A simple mobile-friendly tracker for names, dosage amounts, last shot dates, and optional due dates."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Local records</p>
          <h1 id="page-title">Shot Tracker</h1>
        </div>
        <div class="total-pill" aria-live="polite">
          <span id="record-count">0</span>
          <span>saved</span>
        </div>
      </section>

      <section class="panel entry-panel" aria-labelledby="form-title">
        <div class="section-heading">
          <h2 id="form-title">Add a record</h2>
          <button class="ghost-button hidden" id="cancel-edit" type="button">
            Cancel
          </button>
        </div>

        <form id="shot-form" autocomplete="off">
          <label for="person-name">
            Name
            <input
              id="person-name"
              name="personName"
              type="text"
              placeholder="Person's name"
              required
            />
          </label>

          <label for="dosage-amount">
            Dosage amount
            <input
              id="dosage-amount"
              name="dosageAmount"
              type="number"
              min="0"
              step="any"
              inputmode="decimal"
              placeholder="Example: 0.5"
              required
            />
          </label>

          <label for="dosage-unit">
            Unit
            <select id="dosage-unit" name="dosageUnit" required>
              <option value="mL">mL</option>
              <option value="mg">mg</option>
              <option value="units">units</option>
              <option value="other">other</option>
            </select>
          </label>

          <label class="hidden" for="custom-unit" id="custom-unit-label">
            Custom unit
            <input
              id="custom-unit"
              name="customUnit"
              type="text"
              maxlength="20"
              placeholder="Example: mcg, tablets"
            />
          </label>

          <label for="last-date">
            Last had it
            <input id="last-date" name="lastDate" type="datetime-local" required />
          </label>

          <label for="repeat-days">
            Repeat every
            <input
              id="repeat-days"
              name="repeatDays"
              type="number"
              min="1"
              step="1"
              inputmode="numeric"
              placeholder="Optional days"
            />
          </label>

          <button class="primary-button" id="submit-button" type="submit">
            Save record
          </button>
        </form>
      </section>

      <section class="records-tools" aria-label="Record tools">
        <label class="search-label" for="record-search">
          <span class="sr-only">Search records</span>
          <input id="record-search" type="search" placeholder="Search by name" />
        </label>
        <div class="records-actions">
          <button class="ghost-button" id="export-records" type="button">
            Export sheet
          </button>
          <button class="ghost-button" id="import-records" type="button">
            Import sheet
          </button>
          <button class="danger-button" id="clear-all" type="button">
            Clear all
          </button>
          <input
            id="import-file"
            class="sr-only"
            type="file"
            accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv,application/json,.json"
          />
        </div>
      </section>

      <section class="records" aria-labelledby="records-title">
        <div class="section-heading">
          <h2 id="records-title">Records</h2>
          <p id="last-updated">No records yet</p>
        </div>
        <div id="empty-state" class="empty-state">
          <strong>No shots tracked yet.</strong>
          <span>Add the first record above.</span>
        </div>
        <div id="record-list" class="record-list"></div>
      </section>

      <p class="fine-print">
        Records stay in this browser. Export a sheet before switching devices.
        Follow clinician guidance for medical decisions.
      </p>
    </main>

    <template id="person-template">
      <article class="person-card">
        <div class="person-header">
          <div>
            <h3></h3>
            <p class="person-summary"></p>
          </div>
          <span class="time-badge"></span>
        </div>
        <div class="history-list"></div>
      </article>
    </template>

    <template id="shot-template">
      <section class="shot-row">
        <div class="shot-details">
          <p class="dosage"></p>
          <p class="due-line"></p>
        </div>
        <p class="date-line"></p>
        <div class="card-actions">
          <button class="edit-button" type="button">Edit</button>
          <button class="delete-button" type="button">Delete</button>
        </div>
      </section>
    </template>

    <script src="app.js"></script>
  </body>
</html>
